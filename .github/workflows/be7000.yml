name: Xiaomi BE7000

on:
  pull_request:
    branches: [xiaomi-be7000]
  push:
    branches: [xiaomi-be7000]

permissions:
  contents: read

jobs:
  linux-tests:
    name: Linux controller and shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test the controller on Linux
        working-directory: openwrt/src/controller
        run: go test -race ./...
      - name: Test the OpenWrt shell sources
        working-directory: openwrt/tests/shell
        run: go test ./...

  package:
    name: OpenWrt ARM64 package
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ROUTE_RULES_MAIN_REVISION: d1a3bd6041c5ce7467253f6dd62bc06e025d7497
    defaults:
      run:
        shell: pwsh
        working-directory: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out shared sources from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.ROUTE_RULES_MAIN_REVISION }}
          path: .shared-main
          persist-credentials: false
      - name: Assemble the BE7000 build directory
        shell: bash
        working-directory: .
        run: |
          shared_revision=$(git -C .shared-main rev-parse HEAD)
          test "$shared_revision" = "$ROUTE_RULES_MAIN_REVISION"
          mkdir -- build
          git -C .shared-main archive "$shared_revision" config routing scripts src | tar -x -C build
          git archive HEAD openwrt VERSION | tar -x -C build
          echo "Shared route-rules source from main: $shared_revision"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Enable ARM64 execution on Ubuntu
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
          sudo systemctl restart systemd-binfmt
          test -f /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Install and verify the pinned project cores
        run: |
          . ./scripts/Core-Assets.ps1
          . ./openwrt/scripts/Mosdns-Core.ps1
          $null = Install-BuildCoreAsset -Asset (Get-SingBoxBuildAsset)
          $null = Install-BuildCoreAsset -Asset (Get-MosdnsBuildAsset)
      - name: Generate the Linux client snapshot
        run: |
          ./scripts/Generate-SingBoxConfig.ps1 -Client linux -OutputDirectory outputs/openwrt-client -RequireSingBox
          ./openwrt/scripts/Sync-FinalLinuxSnapshot.ps1
      - name: Build and verify the BE7000 package
        run: |
          $go = (Get-Command go -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          ./openwrt/scripts/Build-OpenWrtPackage.ps1 -GoPath $go -ConnectionVerdictCache
          ./openwrt/tests/Test-NftKernelPolicy.ps1
          ./openwrt/tests/Test-ProxyConfiguration.ps1
          ./openwrt/tests/Test-OpenWrtPackage.ps1 -ExpectedConnectionCacheMode ctmark-v1
          ./openwrt/tests/Test-MosdnsBehavior.ps1 -GoPath $go
      - name: Prepare the versioned artifact
        id: artifact
        run: |
          ./scripts/Export-CiArtifact.ps1 -Component xiaomi-be7000 -PackagePath openwrt/generated/openwrt.zip -BuildManifestPath openwrt/outputs/build/build-manifest.json
      - name: Upload delivery files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
      - name: Upload build information
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}-build-info
          path: ${{ steps.artifact.outputs.evidence_path }}
          if-no-files-found: error
