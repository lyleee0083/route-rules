name: Clients

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-build:
    name: Client rules and configurations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable ARM64 execution on Ubuntu
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
          sudo systemctl restart systemd-binfmt
          test -f /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Install the pinned project sing-box build checker
        run: |
          . ./scripts/Core-Assets.ps1
          $checker = Install-BuildCoreAsset -Asset (Get-SingBoxBuildAsset)
          & $checker version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test routing and archive contracts
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/Test-RoutingRuleCompiler.ps1
          ./tests/Test-SameTypeDirectPolicy.ps1
          ./tests/Test-ConfigArchive.ps1
          ./tests/Test-ClientPathSafety.ps1
          ./tests/Test-SingBoxCoreResolution.ps1 -TestRoot (Join-Path $PWD.Path 'outputs/tests/core-resolution')
      - name: Generate and verify the five client profiles
        run: |
          ./scripts/Generate-SingBoxConfig.ps1 -All -RequireSingBox
          ./tests/Test-PublishedRoutingPolicy.ps1 -ArchivePath generated/sing-box-configs.zip
      - name: Prepare the versioned artifact
        id: artifact
        run: |
          ./scripts/Export-CiArtifact.ps1 -Component clients -PackagePath generated/sing-box-configs.zip
      - name: Upload delivery files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
      - name: Upload build information
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}-build-info
          path: ${{ steps.artifact.outputs.evidence_path }}
          if-no-files-found: error
